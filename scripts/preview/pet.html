<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #202127;
      }
      body {
        display: grid;
        place-items: center;
      }
      .frame {
        width: 288px;
        height: 431px;
        border: 1px solid #34343f;
        border-radius: 8px;
        overflow: hidden;
        background: #202127;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <iframe src="../../src/app/pet.html?demo=1" title="Remielle pet preview"></iframe>
    </div>
  </body>
</html>
